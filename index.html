<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オリパ確率">
<meta name="format-detection" content="telephone=no">
<title>AUTOPRAZA オリパ確率カウンター</title>
<style>
  :root{
    --bg:#0a0814; --panel:#120f22; --line:rgba(255,255,255,.14); --text:#ffffff; --sub:#c9c2ff;
    --rainbow:linear-gradient(90deg,#ff4d4d,#ffa63d,#ffe14d,#4dff88,#3dd5ff,#7a5cff,#ff4dd8,#ff4d4d);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color:var(--text);overflow:hidden;touch-action:manipulation;background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
    background:
      radial-gradient(circle at 15% 20%,rgba(122,92,255,.28),transparent 40%),
      radial-gradient(circle at 85% 80%,rgba(255,77,216,.22),transparent 40%),
      radial-gradient(circle at 60% 10%,rgba(61,213,255,.15),transparent 35%),
      var(--bg);
  }
  .app{
    height:100vh;height:100dvh;display:grid;grid-template-columns:auto 1fr auto;gap:2.4vw;align-items:stretch;
    padding:max(3vh,env(safe-area-inset-top)) max(2.4vw,env(safe-area-inset-right)) max(3vh,env(safe-area-inset-bottom)) max(2.4vw,env(safe-area-inset-left));
  }
  /* 左：ロゴ */
  .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-width:0}
  .logo{
    height:min(68vh,30vw);width:min(68vh,30vw);border-radius:50%;display:block;
    box-shadow:0 0 22px rgba(122,92,255,.55),0 0 44px rgba(255,77,216,.25);
    animation:float 4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2vh)}}
  .shop{font-weight:800;font-size:clamp(11px,4.2vh,20px);text-align:center;max-width:min(68vh,30vw);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
  /* 中央：ネオン枠パネル */
  .frame{
    position:relative;border-radius:22px;padding:3px;min-width:0;min-height:0;
    background:var(--rainbow);background-size:300% 100%;animation:flow 6s linear infinite;
    box-shadow:0 0 18px rgba(122,92,255,.7),0 0 40px rgba(255,77,216,.35);
  }
  @keyframes flow{to{background-position:300% 0}}
  .panel{
    height:100%;border-radius:19px;
    background:radial-gradient(circle at 50% 0%,rgba(122,92,255,.25),transparent 60%),var(--panel);
    display:grid;grid-template-rows:1fr 1fr auto 1.25fr;align-items:center;justify-items:center;padding:1.5vh 2vw;
  }
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1}
  .label{font-weight:800;color:var(--sub);font-size:clamp(10px,3.8vh,18px);letter-spacing:.1em}
  .label::before,.label::after{content:"✦";color:#ffe14d;margin:0 .5em;font-size:.8em}
  .num{font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(28px,17vh,96px);line-height:1;
    text-shadow:0 0 14px rgba(160,130,255,.9),0 0 30px rgba(122,92,255,.5)}
  .hit .num{color:#ffe9a8;text-shadow:0 0 14px rgba(255,200,60,.9),0 0 30px rgba(255,140,40,.5)}
  .divider{width:80%;height:2px;background:var(--rainbow);opacity:.8;border-radius:2px}
  .probwrap{display:flex;flex-direction:column;align-items:center;line-height:1}
  .pnum{
    white-space:nowrap;max-width:100%;
    font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(36px,22vh,130px);line-height:1;
    background:var(--rainbow);background-size:300% 100%;animation:flow 6s linear infinite;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.35));transition:transform .15s;
  }
  .pnum .pct{font-size:.45em}
  .pnum.bump{transform:scale(1.08)}
  .done{display:none;font-weight:900;color:#ff6b9a;font-size:clamp(10px,3.6vh,16px);margin-top:.5vh}
  .done.show{display:block}
  /* 右：ボタン列 */
  .btns{display:grid;grid-template-rows:1.5fr 1.5fr 1fr 1fr;gap:2vh;width:min(24vw,190px);min-height:0}
  button{
    font:inherit;color:#fff;border-radius:14px;font-weight:900;touch-action:manipulation;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;
    background:rgba(18,15,34,.85);border:2px solid rgba(201,194,255,.55);
    box-shadow:0 0 10px rgba(122,92,255,.35) inset;
    transition:transform .06s,filter .06s,opacity .2s;
  }
  button:active{transform:scale(.94);filter:brightness(1.35)}
  button:disabled{opacity:.3}
  .b-hit{background:linear-gradient(135deg,#ff4dd8,#7a5cff);border-color:#ffd6f6;font-size:clamp(14px,6.5vh,28px);
    box-shadow:0 0 16px rgba(255,77,216,.6)}
  .b-miss{font-size:clamp(14px,6.5vh,28px)}
  .b-undo,.b-reset{font-size:clamp(11px,4.4vh,18px)}
  .b-reset.armed{background:#b91c1c;border-color:#ff9a9a}
  .b-sub{font-size:.5em;opacity:.85;font-weight:700}
  .gear{
    position:fixed;z-index:5;left:max(1.2vw,env(safe-area-inset-left));bottom:max(1.5vh,env(safe-area-inset-bottom));
    width:auto;padding:.35em .7em;font-size:clamp(10px,3.4vh,14px);border-radius:10px;opacity:.55;border-width:1px;
  }
  /* 演出 */
  .flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
  .flash.on{opacity:1;transition:none}
  .flash.hit{background:radial-gradient(circle,rgba(255,225,77,.45),rgba(255,77,216,.25) 45%,transparent 75%)}
  .flash.miss{background:radial-gradient(circle,rgba(61,213,255,.18),transparent 70%)}
  /* 設定 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:10;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;width:min(580px,92vw);max-height:94vh;overflow:auto}
  .sheet h2{font-size:17px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{flex:0 0 130px;color:var(--sub);font-weight:700;font-size:15px}
  .row input,.row select{flex:1;font-size:17px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#0b0918;color:#fff;-webkit-user-select:text;user-select:text}
  .acts{display:flex;gap:10px;margin-top:10px}
  .acts button{flex:1;padding:11px;font-size:16px}
  .ok{background:linear-gradient(135deg,#ff4dd8,#7a5cff)!important}
  .err{color:#ff6b9a;font-size:14px;min-height:1.2em;margin-top:2px}
  /* 縦向き */
  @media (orientation:portrait){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:2vh}
    .brand{flex-direction:row}
    .logo{height:14vh;width:14vh}
    .shop{max-width:60vw}
    .btns{width:auto;grid-template-rows:none;grid-template-columns:1fr 1fr;height:24vh}
    .num{font-size:clamp(36px,9vh,90px)}
    .pnum{font-size:clamp(48px,11vh,120px)}
    .label{font-size:clamp(12px,2vh,18px)}
    .gear{bottom:auto;top:max(1.5vh,env(safe-area-inset-top))}
  }
</style>
</head>

FEIUUUUQhRRRRCFFFFEJ//2Q==">
    <div class="shop" id="shopName"></div>
  </div>

  <div class="frame">
    <div class="panel">
      <div class="stat hit">
        <div class="label">当たり残り</div>
        <div class="num" id="hitLeft">0</div>
      </div>
      <div class="stat">
        <div class="num" id="totalLeft">0</div>
        <div class="label">全体の残り</div>
      </div>
      <div class="divider"></div>
      <div class="probwrap">
        <div class="pnum" id="probBox"><span id="prob">0.0</span><span class="pct">%</span></div>
        <div class="done" id="doneMsg">✦ 完売！ありがとうございました ✦</div>
      </div>
    </div>
  </div>

  <div class="btns">
    <button class="b-hit" id="hitBtn" type="button">当たり<span class="b-sub">+1</span></button>
    <button class="b-miss" id="missBtn" type="button">ハズレ<span class="b-sub">+1</span></button>
    <button class="b-undo" id="undoBtn" type="button">1つ戻す</button>
    <button class="b-reset" id="resetBtn" type="button">リセット</button>
  </div>
</div>

<button class="gear" id="gearBtn" type="button">⚙ 設定</button>
<div class="flash" id="flash"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>初期設定（リセット時もこの口数に戻ります）</h2>
    <div class="row"><label for="inShop">ショップ名</label><input id="inShop" type="text" maxlength="30" placeholder="空欄なら非表示"></div>
    <div class="row"><label for="inTotal">全体の口数</label><input id="inTotal" type="number" inputmode="numeric" min="1" step="1"></div>
    <div class="row"><label for="inHits">当たりの口数</label><input id="inHits" type="number" inputmode="numeric" min="0" step="1"></div>
    <div class="row"><label for="inDec">確率の表示</label>
      <select id="inDec"><option value="1">小数第1位（25.0%）</option><option value="2">小数第2位（25.02%）</option></select></div>
    <div class="err" id="err"></div>
    <div class="acts">
      <button id="cancelBtn" type="button">閉じる</button>
      <button class="ok" id="saveBtn" type="button">保存して最初から</button>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var KEY = 'autopraza-oripa-v2';
  var state = { shop:'', dec:1, initTotal:100, initHits:10, total:100, hits:10, history:[] };

  // 保存・読み込み（使えない環境でも動くように try/catch）
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(s && typeof s.total === 'number' && typeof s.hits === 'number'){
        state = s; if(!Array.isArray(state.history)) state.history = [];
        if(state.dec !== 2) state.dec = 1; if(typeof state.shop !== 'string') state.shop = '';
        return true;
      }
    }catch(e){}
    return false;
  }

  var $ = function(id){ return document.getElementById(id); };
  var el = {
    shop:$('shopName'), hitLeft:$('hitLeft'), totalLeft:$('totalLeft'), prob:$('prob'), probBox:$('probBox'),
    done:$('doneMsg'), hit:$('hitBtn'), miss:$('missBtn'), undo:$('undoBtn'), reset:$('resetBtn'),
    flash:$('flash'), modal:$('modal'), inShop:$('inShop'), inTotal:$('inTotal'), inHits:$('inHits'), inDec:$('inDec'), err:$('err')
  };

  function render(){
    el.shop.textContent = state.shop;
    el.hitLeft.textContent = state.hits;
    el.totalLeft.textContent = state.total;
    el.prob.textContent = state.total > 0 ? (state.hits / state.total * 100).toFixed(state.dec) : '--';
    el.shop.style.display = state.shop ? '' : 'none';
    el.hit.disabled  = state.hits <= 0 || state.total <= 0;
    el.miss.disabled = (state.total - state.hits) <= 0;
    el.undo.disabled = state.history.length === 0;
    el.done.className = 'done' + (state.total <= 0 ? ' show' : '');
    fitAll();
  }

  // 数字がパネルからはみ出さないよう、文字サイズを自動で縮める
  function fit(node){
    node.style.fontSize = '';
    var box = node.closest('.panel') || node.parentElement, avail = box.clientWidth;
    var cs = getComputedStyle(box);
    avail -= (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
    var size = parseFloat(getComputedStyle(node).fontSize), guard = 0;
    while(node.scrollWidth > avail * 0.94 && size > 16 && guard++ < 60){
      size -= 2; node.style.fontSize = size + 'px';
    }
  }
  function fitAll(){
    fit(el.probBox);
    fit(el.hitLeft); fit(el.totalLeft);
  }
  window.addEventListener('resize', function(){ setTimeout(fitAll, 50); });
  window.addEventListener('orientationchange', function(){ setTimeout(fitAll, 300); });

  function bump(){
    el.probBox.classList.add('bump');
    setTimeout(function(){ el.probBox.classList.remove('bump'); }, 150);
  }
  function flash(kind){
    el.flash.className = 'flash ' + kind + ' on';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.flash.className = 'flash ' + kind; }); });
  }

  function draw(isHit){
    if(isHit && (state.hits <= 0 || state.total <= 0)) return;
    if(!isHit && (state.total - state.hits) <= 0) return;
    state.history.push(isHit ? 'h' : 'm');
    if(state.history.length > 2000) state.history.shift();
    state.total -= 1;
    if(isHit) state.hits -= 1;
    disarmReset(); save(); render(); bump(); flash(isHit ? 'hit' : 'miss');
  }

  function undo(){
    var last = state.history.pop();
    if(!last) return;
    state.total += 1;
    if(last === 'h') state.hits += 1;
    disarmReset(); save(); render(); bump();
  }

  // リセットは誤タップ防止のため「2回タップ」方式（confirmダイアログを使わない）
  var armTimer = null;
  function disarmReset(){
    clearTimeout(armTimer); armTimer = null;
    el.reset.classList.remove('armed'); el.reset.textContent = 'リセット';
  }
  function resetTap(){
    if(armTimer){
      disarmReset();
      state.total = state.initTotal; state.hits = state.initHits; state.history = [];
      save(); render(); bump();
      return;
    }
    el.reset.classList.add('armed'); el.reset.textContent = 'もう一度タップ';
    armTimer = setTimeout(disarmReset, 2500);
  }

  function openSettings(){
    el.inShop.value = state.shop; el.inTotal.value = state.initTotal; el.inHits.value = state.initHits; el.inDec.value = String(state.dec);
    el.err.textContent = ''; el.modal.className = 'modal show';
  }
  function closeSettings(){ el.modal.className = 'modal'; if(document.activeElement) document.activeElement.blur(); }
  function saveSettings(){
    var t = parseInt(el.inTotal.value, 10), h = parseInt(el.inHits.value, 10);
    if(!(t >= 1)) { el.err.textContent = '全体の口数は1以上の整数で入力してください'; return; }
    if(!(h >= 0)) { el.err.textContent = '当たりの口数は0以上の整数で入力してください'; return; }
    if(h > t)     { el.err.textContent = '当たりの口数が全体の口数を超えています'; return; }
    state.shop = (el.inShop.value || '').trim(); state.dec = el.inDec.value === '2' ? 2 : 1;
    state.initTotal = t; state.initHits = h; state.total = t; state.hits = h; state.history = [];
    save(); render(); closeSettings();
  }

  el.hit.addEventListener('click', function(){ draw(true); });
  el.miss.addEventListener('click', function(){ draw(false); });
  el.undo.addEventListener('click', undo);
  el.reset.addEventListener('click', resetTap);
  $('gearBtn').addEventListener('click', openSettings);
  $('cancelBtn').addEventListener('click', closeSettings);
  $('saveBtn').addEventListener('click', saveSettings);

  // ピンチ拡大を防止（ダブルタップ拡大はCSSの touch-action で防止済み）
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  // 画面スリープ防止（対応端末のみ・失敗しても無視）
  function keepAwake(){
    try{ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(function(){}); } }catch(e){}
  }
  document.addEventListener('click', keepAwake, {once:true});
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') keepAwake(); });

  var hadSaved = load();
  render();
  if(!hadSaved) openSettings();
})();
</script>
</body>
